[project]
name = "calm"
version = "2.0.0"
description = "Daylight-aware, circadian lighting for Home Assistant rooms"
requires-python = ">=3.13"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "ASYNC", "RUF"]
ignore = [
    "RUF001", "RUF002", "RUF003",  # typographic quotes in Dutch texts are intended
    "UP031",  # printf-style formatting is kept where it reads better
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501", "ASYNC240"]

[tool.mypy]
python_version = "3.14"
files = ["custom_components/calm"]
strict = true
ignore_missing_imports = true
warn_unused_ignores = false
