rules:
  # Bronze
  action-setup:
    status: exempt
    comment: Calm registers no actions; everything runs through its entities.
  appropriate-polling:
    status: exempt
    comment: Entities are pushed by the rooms; nothing polls.
  brands: done
  common-modules: done
  config-flow-test-coverage: done
  config-flow: done
  dependency-transparency:
    status: exempt
    comment: No external requirements.
  docs-actions:
    status: exempt
    comment: No actions.
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  entity-event-setup: done
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure:
    status: exempt
    comment: No device or service to connect to.
  test-before-setup:
    status: exempt
    comment: No device or service to connect to.
  unique-config-entry: done

  # Silver
  action-exceptions:
    status: exempt
    comment: No actions.
  config-entry-unloading: done
  docs-configuration-parameters: done
  docs-installation-parameters: done
  entity-unavailable: done
  integration-owner: done
  log-when-unavailable: done
  parallel-updates: done
  reauthentication-flow:
    status: exempt
    comment: No authentication.
  test-coverage: done

  # Gold
  devices: done
  diagnostics: done
  discovery-update-info:
    status: exempt
    comment: Not a discoverable device.
  discovery:
    status: exempt
    comment: Not a discoverable device.
  docs-data-update: done
  docs-examples: done
  docs-known-limitations: done
  docs-supported-devices: done
  docs-supported-functions: done
  docs-troubleshooting: done
  docs-use-cases: done
  dynamic-devices: done
  entity-category: done
  entity-device-class: done
  entity-disabled-by-default: done
  entity-translations: done
  exception-translations:
    status: exempt
    comment: Calm raises no user-facing exceptions; failures go to Repairs.
  icon-translations: done
  reconfiguration-flow: done
  repair-issues: done
  stale-devices: done

  # Platinum
  async-dependency:
    status: exempt
    comment: No external dependency.
  inject-websession:
    status: exempt
    comment: No HTTP client.
  strict-typing: done
